name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libclang-dev libdbus-1-dev pkg-config
          libclang=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang*.so*' -print -quit 2>/dev/null || true)
          if [ -n "$libclang" ]; then
            echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Node.js (if web UI is present)
        if: ${{ hashFiles('crates/recvrd-web/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/recvrd-web/package-lock.json

      - name: Build web UI (if present)
        if: ${{ hashFiles('crates/recvrd-web/package.json') != '' }}
        working-directory: crates/recvrd-web
        run: |
          npm ci
          npm run build

      - name: Build recvrd and recvc
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p recvrd -p recvc

      - name: Check the Linux audio backend
        if: runner.os == 'Linux'
        run: |
          if cargo tree -i alsa-sys --target ${{ matrix.target }} 2>/dev/null | grep -q 'alsa-sys'; then
            echo "alsa-sys is still in the Linux dependency graph"
            exit 1
          fi
          if ldd "target/${{ matrix.target }}/release/recvrd" | grep -q libasound; then
            echo "the Linux binary links libasound"
            exit 1
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="recvrd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/recvrd" dist/recvrd
          cp "target/${{ matrix.target }}/release/recvc" dist/recvc
          cp "target/${{ matrix.target }}/release/ytermusicd" dist/ytermusicd
          cp "target/${{ matrix.target }}/release/ytmc" dist/ytmc
          if [ -d crates/recvrd-web/dist ]; then
            cp -R crates/recvrd-web/dist dist/web
          fi
          tar -czf "${name}.tar.gz" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "recvrd-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/recvrd.exe" "dist/recvrd.exe"
          Copy-Item "target/${{ matrix.target }}/release/recvc.exe" "dist/recvc.exe"
          Copy-Item "target/${{ matrix.target }}/release/ytermusicd.exe" "dist/ytermusicd.exe"
          Copy-Item "target/${{ matrix.target }}/release/ytmc.exe" "dist/ytmc.exe"
          if (Test-Path "crates/recvrd-web/dist") {
            Copy-Item -Recurse "crates/recvrd-web/dist" "dist/web"
          }
          Compress-Archive -Path "dist/*" -DestinationPath "$name.zip"
          Get-FileHash "$name.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $name.zip" } |
            Set-Content "$name.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recvrd-${{ matrix.target }}
          path: |
            recvrd-*.tar.gz
            recvrd-*.tar.gz.sha256
            recvrd-*.zip
            recvrd-*.zip.sha256
          if-no-files-found: error

      - name: Publish release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            recvrd-*.tar.gz
            recvrd-*.tar.gz.sha256
            recvrd-*.zip
            recvrd-*.zip.sha256
