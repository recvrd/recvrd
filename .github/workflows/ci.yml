name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libclang-dev libdbus-1-dev pkg-config
          libclang=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang*.so*' -print -quit 2>/dev/null || true)
          if [ -n "$libclang" ]; then
            echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          fi

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Check the Linux audio backend
        run: |
          cargo build -p recvrd
          if cargo tree -i alsa-sys --target x86_64-unknown-linux-gnu 2>/dev/null | grep -q 'alsa-sys'; then
            echo "alsa-sys is still in the Linux dependency graph"
            exit 1
          fi
          if ldd target/debug/recvrd | grep -q libasound; then
            echo "the Linux binary links libasound"
            exit 1
          fi

      - name: Check generated API bindings
        run: git diff --exit-code -- crates/recvrd-api/bindings

  web:
    name: Web build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Detect web crate
        id: detect
        shell: bash
        run: |
          if [ -f crates/recvrd-web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/recvrd-web/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: crates/recvrd-web
        run: npm ci

      - name: Check web types
        if: steps.detect.outputs.present == 'true'
        working-directory: crates/recvrd-web
        run: npm run check

      - name: Test web UI
        if: steps.detect.outputs.present == 'true'
        working-directory: crates/recvrd-web
        run: npm test

      - name: Build web UI
        if: steps.detect.outputs.present == 'true'
        working-directory: crates/recvrd-web
        run: npm run build

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Check flake
        run: nix flake check

      - name: Build Nix packages
        run: nix build .#recvrd .#recvc

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the arm64 yt-dlp stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ytdlp
          platforms: linux/arm64
          cache-from: type=gha

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: recvrd:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: recvrd:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the runtime image
        run: |
          docker run --rm --entrypoint /usr/local/bin/yt-dlp recvrd:test --version
          docker run --rm --entrypoint /usr/bin/ffmpeg recvrd:test -version
          docker run --rm --entrypoint /usr/local/bin/recvrd recvrd:test --version
          docker run --rm --entrypoint sh recvrd:test -c 'test "$HOME" = /home/recvrd'

      - name: Smoke test the development image
        run: |
          docker run --rm --entrypoint sh recvrd:dev-test -c '
            for tool in yt-dlp ffmpeg node npm cargo; do
              command -v "$tool"
            done
            test -f /app/crates/recvrd-web/dist/index.html
          '
