# Develop the daemon with Compose.
# This file overrides compose.yaml. Use both files together.
# The daemon runs from the source mount with cargo run.
# The web service builds the embedded UI and runs the Vite dev server.
# The web service shares the daemon network.
# The Vite proxy sends /api to 127.0.0.1:8080 in that network.
# The daemon binds 0.0.0.0 inside the container.
# The PipeWire and D-Bus mounts enable local audio and MPRIS.
# The mounts do nothing on a host without PipeWire or D-Bus.
# Remove them on a headless host.
services:
  recvrd:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: recvrd:dev
    entrypoint: ["cargo", "run", "-p", "recvrd", "--bin", "recvrd", "--"]
    command: ["serve"]
    depends_on:
      web-init:
        condition: service_completed_successfully
    ports: !override
      - "127.0.0.1:5173:5173"
    environment:
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${UID:-1000}/bus
    volumes:
      - .:/app
      - recvrd-cargo-target:/cargo-target
      - recvrd-cargo-home:/home/recvrd/.cargo
      - recvrd-web-dist:/app/crates/recvrd-web/dist
      - ${XDG_RUNTIME_DIR:-/run/user/${UID:-1000}}/pipewire-0:/run/user/${UID:-1000}/pipewire-0:ro
      - ${XDG_RUNTIME_DIR:-/run/user/${UID:-1000}}/bus:/run/user/${UID:-1000}/bus:ro
  web-init:
    image: busybox
    user: "0:0"
    volumes:
      - .:/repo
    command: sh -c "mkdir -p /repo/crates/recvrd-web/dist /repo/crates/recvrd-web/node_modules && chown ${UID:-1000}:${GID:-1000} /repo/crates/recvrd-web/dist /repo/crates/recvrd-web/node_modules"
  web:
    image: node:22-bookworm-slim
    working_dir: /repo/crates/recvrd-web
    network_mode: service:recvrd
    depends_on:
      recvrd:
        condition: service_started
      web-init:
        condition: service_completed_successfully
    volumes:
      - .:/repo
      - web-node-modules:/repo/crates/recvrd-web/node_modules
      - recvrd-web-dist:/repo/crates/recvrd-web/dist
    command: sh -c "npm ci && npm run build && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  recvrd-cargo-target:
  recvrd-cargo-home:
  recvrd-web-dist:
  web-node-modules:
