# Develop the daemon with Compose.
# This file overrides compose.yaml. Use both files together.
# The daemon runs from the source mount with cargo run.
# The web service runs the Vite dev server.
# The web service shares the daemon network.
# The Vite proxy sends /api to 127.0.0.1:8080 in that network.
# The daemon binds 0.0.0.0 inside the container.
# The PipeWire and D-Bus mounts enable local audio and MPRIS.
# The mounts do nothing on a host without PipeWire or D-Bus.
# Remove them on a headless host.
services:
  recvrd:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    entrypoint: ["cargo", "run", "-p", "recvrd", "--"]
    command: ["serve"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${UID:-1000}/bus
    volumes:
      - .:/app
      - recvrd-cargo-target:/app/target
      - recvrd-cargo-registry:/usr/local/cargo/registry
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pipewire-0:/run/user/${UID:-1000}/pipewire-0:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/bus:/run/user/${UID:-1000}/bus:ro
  web:
    image: node:22-bookworm-slim
    working_dir: /repo/crates/recvrd-web
    network_mode: service:recvrd
    depends_on:
      - recvrd
    volumes:
      - .:/repo
      - web-node-modules:/repo/crates/recvrd-web/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  recvrd-cargo-target:
  recvrd-cargo-registry:
  web-node-modules:
