[package]
name = "ytmc"
version = "0.6.3"
edition = "2024"
license = "Apache-2.0"
description = "Terminal client for the ytermusicd daemon"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.29"
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "sync", "time"] }
ytermusicd-api.workspace = true
ytermusicd-client.workspace = true
