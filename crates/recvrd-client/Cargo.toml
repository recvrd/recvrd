[package]
name = "recvrd-client"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
description = "HTTP and SSE client for the recvrd daemon"

[dependencies]
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["time"] }
recvrd-api.workspace = true

[dev-dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1.36", features = ["macros", "net", "rt-multi-thread"] }
