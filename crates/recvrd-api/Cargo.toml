[package]
name = "recvrd-api"
version = "0.6.3"
edition = "2024"
license = "Apache-2.0"
description = "Shared HTTP/SSE DTOs for recvrd"

[dependencies]
async-trait = "0.1"
common-structs.workspace = true
schemars = { version = "1.2", optional = true }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "11", features = ["serde-compat"] }

[features]
default = []
schema = ["dep:schemars", "common-structs/schema"]

[dev-dependencies]
serde_json = "1"
