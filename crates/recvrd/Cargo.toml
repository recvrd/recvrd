[package]
name = "recvrd"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
description = "Headless YouTube Music daemon with a web UI, MPRIS and MCP"

[[bin]]
name = "recvrd"
path = "src/main.rs"

[[bin]]
name = "ytermusicd"
path = "src/bin/ytermusicd.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
common-structs.workspace = true
database.workspace = true
download-manager.workspace = true
env_logger = "0.11"
flume = "0.11"
futures-util = "0.3"
log = "0.4"
mime_guess = "2"
player.workspace = true
provider-podverse.workspace = true
provider-rss.workspace = true
provider-youtube.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.10", features = ["transport-io"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.7.3"
stream-download = { version = "0.24.6", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
tokio = { version = "1.36", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
recvrd-api = { workspace = true, features = ["schema"] }
recvrd-client.workspace = true
recvrd-core.workspace = true

[dev-dependencies]
common-structs.workspace = true
serde_json = "1"
tempfile = "3"
