[package]
name = "common-structs"
version = "0.7.0"
edition = "2024"

[dependencies]
schemars = { version = "1.2", optional = true }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "11", features = ["serde-compat"] }

[features]
default = []
schema = ["dep:schemars"]

[dev-dependencies]
serde_json = "1"
