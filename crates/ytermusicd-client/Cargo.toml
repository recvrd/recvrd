[package]
name = "ytermusicd-client"
version = "0.6.3"
edition = "2024"
license = "Apache-2.0"
description = "HTTP and SSE client for the ytermusicd daemon"

[dependencies]
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["time"] }
ytermusicd-api.workspace = true

[dev-dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1.36", features = ["macros", "net", "rt-multi-thread"] }
