[package]
name = "player"
version = "0.7.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
common-structs.workspace = true
flume = "0.11.0"
log = "0.4.29"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }

#[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_53"] }
rodio = { version = "0.21.1", default-features = false, features = ["symphonia-aac", "symphonia-isomp4", "mp3", "flac", "vorbis"] }
rtrb = "0.3"
serde_json = "1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "mp3", "flac", "vorbis"] }

[dev-dependencies]
tempfile = "3"
