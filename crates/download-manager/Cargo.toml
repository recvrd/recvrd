[package]
name = "download-manager"
version = "0.6.2"
edition = "2024"

[dependencies]
async-trait = "0.1"
flume = "0.11.0"
once_cell = "1.19.0"
tokio = { version = "1.36.0", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
database.workspace = true
common-structs.workspace = true
ytermusicd-core.workspace = true

log = "0.4.20"

[dev-dependencies]
tempfile = "3"