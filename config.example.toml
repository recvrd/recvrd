# recvrd configuration
#
# Copy this file to $XDG_CONFIG_HOME/recvrd/config.toml
# (usually ~/.config/recvrd/config.toml), or pass `--config <path>`.
#
# CLI flags and environment variables override these values:
#   --bind / RECVRD_BIND
#   --port / RECVRD_PORT
#   --headers / RECVRD_HEADERS
#   --config / RECVRD_CONFIG

# bind = "127.0.0.1"
# port = 8080
# headers = "/home/user/.config/recvrd/headers.txt"

# Maximum number of parallel downloads.
parallel_downloads = 4

# "ytdlp" or "rusty_ytdl".
downloader = "ytdlp"

# Enable MPRIS/D-Bus media controls.
dbus = true

# Initial player volume, 0-100.
initial_volume = 50

# Audio output for the PipeWire backend on Linux. The default is 48000 Hz
# f32. The sample rate accepts 8000 to 384000. The format accepts "f32",
# "s32", and "s24". See docs/audio.md for the system device format.
# [audio]
# sample_rate = 48000
# format = "f32"

# Maximum size of the cover cache in MiB. 0 disables the limit.
cover_cache_mb = 100

# Maximum size of the download cache in MiB. 0 disables the limit.
# Eviction removes the oldest complete downloads first.
cache_limit_mb = 10240

# Podverse provider. The provider is disabled when base_url is empty.
# Set the URL to the API base, including the API version. Do not put a
# secret in this file when other users can read it.
# [podverse]
# base_url = "https://podverse.example.com/api/v2"
# token = "optional-bearer-token"

# Environment overrides:
#   RECVRD_PODVERSE_URL
#   RECVRD_PODVERSE_TOKEN

# Last.fm scrobbling. Off by default. Register an API account at
# https://www.last.fm/api/account/create to get an API key and secret.
# Then complete the desktop auth flow to get a session key. Keep the
# secrets out of a shared file.
# [lastfm]
# enabled = true
# api_key = "your-api-key"
# api_secret = "your-api-secret"
# session_key = "your-session-key"

# Environment overrides:
#   RECVRD_LASTFM_ENABLED
#   RECVRD_LASTFM_API_KEY
#   RECVRD_LASTFM_API_SECRET
#   RECVRD_LASTFM_SESSION_KEY

# ListenBrainz scrobbling. Off by default. Create a user token at
# https://listenbrainz.org/settings/ and keep it out of a shared file.
# [listenbrainz]
# enabled = true
# token = "your-user-token"

# Environment overrides:
#   RECVRD_LISTENBRAINZ_ENABLED
#   RECVRD_LISTENBRAINZ_TOKEN

# Playback modes are not set here. The daemon stores per-provider choices
# in $XDG_CONFIG_HOME/recvrd/settings.toml and changes them through
# PUT /api/providers/{provider}/playback. The defaults are:
#   youtube = "download"
#   rss     = "download"
#   podverse = "stream_then_download"
